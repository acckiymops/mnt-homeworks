---
- name: Install dependencies
  become: true
  ansible.builtin.yum:
    name:
      - epel-release
      - nginx
      - git
    state: present
- name: Create nginx main config
  become: true
  ansible.builtin.template:
    src: templates/nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
- name: Clone Lighthouse
  ansible.builtin.git:
    repo: "{{ lighthouse_vcs }}"
    version: master
    dest: "{{ lighthouse_location_dir }}"
- name: Create Lighthouse nginx config
  become: true
  ansible.builtin.template:
    src: lighthouse.conf.j2
    dest: /etc/nginx/conf.d/default.conf
    mode: "0644"
- name: Ensure nginx is running
  become: true
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
  notify: Started nginx
